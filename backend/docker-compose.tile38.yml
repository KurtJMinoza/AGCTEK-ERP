# OPTIONAL / LEGACY — prefer standalone Tile38 on Windows.
# See docs/SCM_TILE38_STANDALONE.md (native tile38-server.exe on :9851).
#
#   docker compose -f docker-compose.tile38.yml up -d
#
services:
  tile38:
    image: tile38/tile38:latest
    ports:
      - "9851:9851"
    volumes:
      - tile38-data:/data
    restart: unless-stopped

volumes:
  tile38-data:
