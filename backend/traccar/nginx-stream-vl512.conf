# AGCTEK SCM — nginx stream sample for Jimi VL512 (GT06 :5023)
#
# Target: Windows on-prem nginx with ngx_stream_module.
# Full runbook: docs/SCM_TRACCAR_VL512.md
#
# Usage (nginx for Windows):
#   1. Copy this file next to nginx.conf (or adjust the include path).
#   2. In nginx.conf, OUTSIDE the http { } block, add:
#
#        stream {
#            include nginx-stream-vl512.conf;
#        }
#
#   3. Prefer Traccar GT06 on an internal port (e.g. gt06.port=25023) so nginx
#      alone owns public 5023. If Traccar stays on 5023, use a different nginx
#      listen port and point the VL512 SERVER SMS at that port instead.
#   4. Allow inbound TCP 5023 in Windows Firewall.
#   5. nginx -t && nginx -s reload
#
# Do not use port 5015 here (Huabao / VL502). Do not put this inside http { }.

server {
    listen 5023;
    # Match <entry key='gt06.port'>25023</entry> in Traccar conf (native Windows)
    proxy_pass 127.0.0.1:25023;
    proxy_connect_timeout 10s;
    # Trackers keep long-lived TCP sockets
    proxy_timeout 3600s;
}
